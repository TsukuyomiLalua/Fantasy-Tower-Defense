<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Sigyn Tower Defense v0.31 — Mobile Prototype</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app" class="app-shell" data-perf-tier="0">
    <!-- Top HUD (Compact, never overflows horizontally) -->
    <header class="top-hud">
      <div class="hud-row">
        <div class="hud-pill"><span class="lbl">WAVE</span><span id="hud-wave" class="val">1</span></div>
        <div class="hud-pill"><span class="lbl">暴走Lv</span><span id="hud-rampage" class="val">0</span></div>
        <div class="hud-pill"><span class="lbl">敵/待機</span><span id="hud-enemies" class="val">0/0</span></div>
        <div class="hud-pill"><span class="lbl">FPS</span><span id="hud-fps" class="val">60</span></div>
      </div>
      <div class="hud-row">
        <div class="hud-pill"><span class="lbl">GOLD</span><span id="hud-gold" class="val">1,500</span></div>
        <div class="hud-pill"><span class="lbl">RP</span><span id="hud-rp" class="val">10</span></div>
        <div class="hud-pill"><span class="lbl">拠点/結界</span><span id="hud-base" class="val">10/100</span></div>
        <div class="hud-pill"><span class="lbl">SCORE</span><span id="hud-score" class="val">0</span></div>
      </div>
    </header>

    <!-- Main 9:16 Battlefield Canvas -->
    <main class="stage-wrap">
      <canvas id="game-canvas" class="game-canvas"></canvas>
      <div id="perf-badge" class="perf-badge">軽量化: 段階0 (通常)</div>
      <div id="toast-banner" class="toast-banner" aria-live="polite"></div>

      <!-- Research Tree Modal Drawer -->
      <section id="tree-drawer" class="drawer hidden" aria-label="研究ツリー">
        <div class="drawer-header">
          <div>
            <h2>研究ツリー (全225ノード / 1〜1e10 RP)</h2>
            <p class="drawer-sub">1e7超えは指数表記・各タワー一本道レーン連動</p>
          </div>
          <button id="btn-close-tree" class="btn-icon" type="button">✕</button>
        </div>
        <div id="tree-tabs" class="tab-bar"></div>
        <div id="tree-list" class="tree-list"></div>
      </section>

      <!-- Tower & Growth Panel Drawer -->
      <section id="tower-drawer" class="drawer hidden" aria-label="タワー配置・成長促進">
        <div class="drawer-header">
          <div>
            <h2>タワー配置 &amp; 成長促進</h2>
            <p class="drawer-sub">加速倍率: 毎Lv+0.01 / 5Lv毎+0.1</p>
          </div>
          <button id="btn-close-tower" class="btn-icon" type="button">✕</button>
        </div>
        <div class="growth-box">
          <div class="growth-info">
            <span>成長促進 Lv.<strong id="growth-lv">1</strong></span>
            <span>次コスト: <strong id="growth-cost">200</strong> G</span>
          </div>
          <button id="btn-growth" class="btn-primary" type="button">成長促進を実行</button>
        </div>
        <div id="tower-shop-list" class="shop-list"></div>
        <div id="selected-tower-box" class="selected-tower-box">
          <p class="muted">盤面のタワーをタップすると個別強化（加速コスト）ができます。</p>
        </div>
      </section>
    </main>

    <!-- Bottom Controls (Thumb-friendly) -->
    <footer class="bottom-hud">
      <div class="ctrl-row">
        <button id="btn-rush" class="btn-accent" type="button">次ウェーブ前倒し</button>
        <button id="btn-auto" class="btn-toggle active" type="button">自動: ON</button>
        <button id="btn-pause" class="btn-toggle" type="button">一時停止</button>
      </div>
      <div class="ctrl-row">
        <button id="btn-open-tower" class="btn-secondary" type="button">タワー配置</button>
        <button id="btn-open-tree" class="btn-secondary" type="button">研究ツリー</button>
        <div class="speed-group">
          <button class="btn-spd active" data-spd="1" type="button">x1</button>
          <button class="btn-spd" data-spd="2" type="button">x2</button>
          <button class="btn-spd" data-spd="3" type="button">x3</button>
          <button class="btn-spd" data-spd="5" type="button">x5</button>
        </div>
      </div>
    </footer>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
