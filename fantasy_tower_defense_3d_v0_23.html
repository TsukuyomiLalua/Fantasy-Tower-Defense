in:0 0 5px;font-size:13px}.node-detail p{margin:4px 0;color:var(--muted);font-size:10px;line-height:1.4}.node-detail .controls{margin-top:7px}

<body>
<div id="game"></div>
<div id="lobby"><div class="lobby-card"><h1>FANTASY TOWER DEFENSE</h1><p>緑の渓谷 — 一本道のS字ルートと高低差を活かして、防衛拠点を守ろう。</p><h3>難易度選択</h3><div class="difficulty-grid"><button class="difficulty-btn active" data-difficulty="normal">NORMAL<small>標準的な防衛戦</small></button><button class="difficulty-btn" data-difficulty="easy">EASY<small>敵の耐久・出現数を抑える</small></button><button class="difficulty-btn" data-difficulty="hard">HARD<small>敵が強く、報酬も増加</small></button><button class="difficulty-btn" data-difficulty="hell">HELL<small>高密度・高耐久の過酷な戦場</small></button></div><div class="map-note">配置地形：開けた高台（弾丸・爆発）／通常地面（弾丸）／魔力地点（振動）<br>高台は射程が伸び、崖や遺跡は射線を遮るよ。</div><div class="lobby-actions"><button class="primary" id="deploy">出撃する</button><button id="lobbySystems">研究・実績</button><button id="lobbySave">セーブ管理</button></div></div></div>
<div id="top"><div class="pill">FANTASY TD <b>3D v0.23</b></div><div class="stats"><div class="statmini">WAVE<b id="wave">1</b></div><div class="statmini">GOLD<b id="gold">150</b></div><div class="statmini">拠点<b id="lives">20</b></div><div class="statmini">結界<b id="shield">0</b></div><div class="statmini">撃破<b id="kills">0</b></div><div class="statmini">敵<b id="enemyCount">0</b></div><div class="statmini">待機<b id="waitingCount">0</b></div><div class="statmini">塔<b id="towerCount">0</b></div><div class="statmini">スコア<b id="score">0</b></div></div></div>
<div id="hint">S字ルートを突破させるな！ ／ ドラッグ：回転・2本指：移動とズーム</div>
<div id="towerPanel" class="panel"><button class="towerChoice" data-kind="bullet">弾丸塔 <small>単体攻撃・通常地面/高台 / 30G</small></button><button class="towerChoice" data-kind="blast">爆発塔 <small>範囲攻撃・開けた高台 / 45G</small></button><button class="towerChoice" data-kind="vibe">振動塔 <small>減速攻撃・魔力地点 / 40G</small></button></div>
<div id="bottom"><div id="actions" class="panel"><button id="startWave" class="primary">WAVE 1 開始</button><button id="autoWave">自動：OFF</button><button id="pause">一時停止</button><button id="build">タワー配置</button><button id="systems">研究・実績</button><button id="resetCam">視点</button><button class="speed active" data-speed="1">×1</button><button class="speed" data-speed="2">×2</button><button class="speed" data-speed="3">×3</button><button class="speed" data-speed="5">×5</button></div></div>
<div id="infoWindow" role="dialog" aria-label="対象の情報"><div class="infoHead"><h3 id="infoTitle">対象情報</h3><button class="closeInfo" id="closeInfo">閉じる</button></div><div id="infoContent"></div></div>
<div id="systemsWindow"><div class="infoHead"><h3>防衛管理</h3><button class="closeInfo" id="closeSystems">閉じる</button></div><div class="infoGrid"><div class="infoStat"><span>研究ポイント（RP）</span><b id="rpCount">0</b></div><div class="infoStat"><span>累計撃破</span><b id="totalKills">0</b></div></div><div class="sysTabs"><button data-sys="research" class="active">研究ツリー</button><button data-sys="achievements">実績</button><button data-sys="stats">統計</button><button data-sys="towers">塔管理</button></div><div id="sys-research" class="sysPage active"><div class="tree-board" id="prestigeTree"></div><div class="node-detail" id="nodeDetails"><h4>研究ノードを選択</h4><p>ノードを選ぶと研究効果と必要RPが表示されるよ。</p></div></div><div id="sys-achievements" class="sysPage"><div id="achievements"></div></div><div id="sys-stats" class="sysPage"><div id="statistics" class="infoNote"></div></div><div id="sys-towers" class="sysPage"><div class="achievement"><b>弾丸塔</b>通常地面・開けた高台に配置可能。単体への連続攻撃が得意。</div><div class="achievement"><b>爆発塔</b>開けた高台に配置可能。着弾地点の周囲に範囲ダメージを与える。</div><div class="achievement"><b>振動塔</b>魔力地点に配置可能。敵を攻撃しながら移動速度を低下させる。</div><div class="infoNote">開けた高台は弾丸塔・爆発塔で共通。高台では射程が12%伸びるよ。</div></div></div>
<div class="overlay" id="result"><div class="modal"><h2>防衛失敗…！</h2><p>到達ウェーブ <b id="resWave">1</b> ／ 撃破 <b id="resKills">0</b></p><p>スコア</p><div class="big" id="scoreCount">0</div><p>獲得研究ポイント（RP）</p><div class="big" id="earnedRP">0</div><p class="notice">スコア報酬と実績報酬を加算したよ。</p><button class="primary" id="again">もう一度挑戦</button></div></div>
<div id="toast"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $=id=>document.getElementById(id);
const host=$('game'),scene=new THREE.Scene();scene.background=new THREE.Color(0x9fc4d1);scene.fog=new THREE.Fog(0x9fc4d1,58,135);
const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,220),renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.55));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe7f5ff,0x59634a,2));const sun=new THREE.DirectionalLight(0xffedc6,2.2);sun.position.set(-18,30,14);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-50;sun.shadow.camera.right=50;sun.shadow.camera.top=50;sun.shadow.camera.bottom=-50;scene.add(sun);
const mat=(color,roughness=1)=>new THREE.MeshStandardMaterial({color,roughness,flatShading:true});
const grassMat=mat(0x6d9b57),grassDark=mat(0x557d49),roadMat=mat(0x9a927d),roadEdge=mat(0x625f55),stoneMat=mat(0x77796f),woodMat=mat(0x705037),leafMat=mat(0x3f7548),leaf2=mat(0x5e8d4d),goldMat=mat(0xd9ae52),enemyMat=mat(0x9b5145),enemyLight=mat(0xd28a65),towerMat=mat(0x667a9b),towerTop=mat(0xb9c6d0),blueMat=mat(0x75c8ec),redMat=mat(0xd65c50);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,74),grassMat);ground.rotation.x=-Math.PI/2;ground.position.y=-.12;ground.receiveShadow=true;scene.add(ground);
for(let i=0;i<78;i++){const x=(Math.random()-.5)*92,z=(Math.random()-.5)*66,p=new THREE.Mesh(new THREE.CircleGeometry(.35+Math.random()*1.2,5),Math.random()>.5?grassDark:grassMat);p.rotation.x=-Math.PI/2;p.position.set(x,-.105,z);p.scale.y=.65;scene.add(p)}
const lanes=[[[-43,-24],[-34,-24],[-27,-19],[-22,-10],[-14,-7],[-5,-7],[3,0],[11,8],[20,9],[28,4],[34,0],[41,0]]];
const routePoints=lanes;
function makeRoad(points,width){const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(p[0],.015,p[1]))),divisions=Math.max(50,points.length*16),verts=[],indices=[];for(let i=0;i<=divisions;i++){const t=i/divisions,p=curve.getPoint(t),tan=curve.getTangent(t),side=new THREE.Vector3(-tan.z,0,tan.x).normalize();for(const s of [-1,1]){const v=p.clone().addScaledVector(side,s*width/2);verts.push(v.x,v.y,v.z)}if(i<divisions){const a=i*2;indices.push(a,a+1,a+2,a+1,a+3,a+2)}}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));geo.setIndex(indices);geo.computeVertexNormals();const mesh=new THREE.Mesh(geo,roadMat);mesh.receiveShadow=true;scene.add(mesh);const edge=new THREE.Mesh(geo.clone(),roadEdge);edge.position.y=-.035;scene.add(edge);for(let i=2;i<divisions;i+=5){const t=i/divisions,p=curve.getPoint(t),tan=curve.getTangent(t),seam=new THREE.Mesh(new THREE.BoxGeometry(width,.025,.055),stoneMat);seam.position.set(p.x,.045,p.z);seam.rotation.y=Math.atan2(tan.x,tan.z);scene.add(seam)}}
lanes.forEach(p=>makeRoad(p,5.2));

 for(const t of towers){t.cool-=dt;if(t.cool>0)continue;let targetEnemy=null,best=towerRange(t);for(const e of enemies){const p=enemyPosition(e),d=Math.hypot(p.x-t.x,p.z-t.z,((t.y||0)+1.7)-.8);if(d<best&&hasLineOfSight(t,e)){best=d;targetEnemy=e}}if(targetEnemy){let dmg=towerDamage(t),crit=Math.random()<nodeLevel('critical')*.015;if(crit)dmg*=1.75;const kind=t.kind;if(kind==='blast'){const radius=3.8+nodeLevel('blastRadius')*.08;const tp=enemyPosition(targetEnemy);for(const e of enemies){const p=enemyPosition(e);if(Math.hypot(p.x-tp.x,p.z-tp.z)<=radius)damageEnemy(e,dmg*.75,'blast')}}else if(kind==='vibe'){damageEnemy(targetEnemy,dmg*.6,'vibe')}else damageEnemy(targetEnemy,dmg,'bullet');makeShot(t,targetEnemy,dmg,kind);t.cool= t.baseInterval*Math.max(.65,1-nodeLevel('haste')*.025)}}
 for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.life-=dt;const k=1-s.life/s.max;s.mesh.position.lerpVectors(s.start,s.end,k);if(s.life<=0){if(s.kind==='blast'){const p=s.end;burstAt(p,3.8+nodeLevel('blastRadius')*.08,0xffbd55)}scene.remove(s.mesh);shots.splice(i,1)}}
 for(let i=effects.length-1;i>=0;i--){const fx=effects[i];fx.life-=dt;const k=Math.max(0,fx.life/fx.max);if(fx.kind==='ring'){const scale=Math.max(.08,(fx.radius/.37)*(1-k));fx.mesh.scale.setScalar(scale);fx.mesh.material.opacity=k}else if(fx.kind==='flash'){fx.mesh.scale.setScalar(1+(1-k)*2);fx.mesh.material.opacity=k}else{fx.mesh.position.x+=fx.vx*dt;fx.mesh.position.y+=fx.vy*dt;fx.mesh.position.z+=fx.vz*dt;fx.vy-=8*dt;fx.mesh.rotation.x+=dt*5;fx.mesh.rotation.z+=dt*4;if(fx.mesh.material.opacity!==undefined)fx.mesh.material.opacity=k}if(fx.life<=0){scene.remove(fx.mesh);fx.mesh.geometry.dispose();effects.splice(i,1)}}
 for(const p of portals){p.ring.rotation.z+=dt*.85;p.core.rotation.y+=dt*1.15}heart.rotation.y+=dt*.55;
 for(const e of [...enemies])if(e.hp<=0)killEnemy(e);
 if(lives<=0){finish();return}
 if(spawnLeft===0&&enemies.length===0&&spawnQueue.length===0&&running){running=false;const completed=wavesInProgress.splice(0);const repair=nodeLevel('repair'),repairEvery=Math.max(1,6-repair);stats.totalWaves+=completed.length;if(completed.length)stats.highestWave=Math.max(stats.highestWave,...completed);checkAchievements();for(const w of completed)if(repair>0&&w%repairEvery===0&&lives<maxLives)lives=Math.min(maxLives,lives+1);wave++;if(autoAdvance){waveCountdown=3;updateUI();requestAnimationFrame(loop);return}toast('ウェーブ突破！次の防衛に備えよう');updateUI();return}
 if(selectedEntity&&enemies.includes(selectedEntity)&&Math.random()<.08)setInfo(selectedEntity);updateUI();requestAnimationFrame(loop)}
function loadInitial(){loadMeta();maxLives=20+nodeLevel('vitality')*2;lives=maxLives;gold=150+nodeLevel('startGold')*20;shield=nodeLevel('ward');updateUI();renderAchievements();renderPrestigeTree()}
loadInitial();
const clock=new THREE.Clock();function render(){requestAnimationFrame(render);const dt=Math.min(clock.getDelta(),.04);renderer.render(scene,camera)}render();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.55))});
</script>
